<body un-cloak>
  <div id="app"></div>
  <script>
    window.sanitizeCmsHtml = (html, opts = {}) => {
      if (!html) return '';
      const template = document.createElement('template');
      template.innerHTML = String(html);
      const blocked = opts.allowIframes
        ? 'script,style,object,embed,link,meta'
        : 'script,style,iframe,object,embed,link,meta';

      template.content.querySelectorAll(blocked).forEach((node) => node.remove());

      template.content.querySelectorAll('*').forEach((node) => {
        [...node.attributes].forEach((attr) => {
          const name = attr.name.toLowerCase();
          const value = attr.value.trim();

          if (name.startsWith('on') || name === 'style') {
            node.removeAttribute(attr.name);
            return;
          }

          if ((name === 'href' || name === 'src' || name === 'xlink:href') && /^javascript:/i.test(value)) {
            node.removeAttribute(attr.name);
          }
        });

        if (node.tagName === 'A' && node.getAttribute('target') === '_blank') {
          node.setAttribute('rel', 'noopener noreferrer');
        }
      });

      return template.innerHTML;
    };

    const options = {
      moduleCache: { vue: Vue },
      async getFile(url) {
        const res = await fetch(url);
        if (!res.ok) throw Object.assign(new Error(res.statusText + ' ' + url), { res });
        return {
          getContentData: (asBinary) => asBinary ? res.arrayBuffer() : res.text(),
        };
      },
      addStyle(textContent) {
        const style = Object.assign(document.createElement('style'), { textContent });
        const ref = document.head.getElementsByTagName('style')[0] || null;
        document.head.insertBefore(style, ref);
      },
    };

    const { loadModule } = window['vue3-sfc-loader'];
    window.sfcOptions = options;
    const loadAsyncComponent = (path) => Vue.defineAsyncComponent(() => loadModule(path, options));
    const loadRouteComponent = (path) => () => loadModule(path, options);

    const MagnoliaComponents = {
      MagnoliaZone: loadAsyncComponent('./components/Magnolia/MagnoliaZone.vue'),
      MagnoliaSingleContentZone: loadAsyncComponent('./components/Magnolia/MagnoliaSingleContentZone.vue'),
      MagnoliaDualContentZone: loadAsyncComponent('./components/Magnolia/MagnoliaDualContentZone.vue'),
      MagnoliaHeading: loadAsyncComponent('./components/Magnolia/MagnoliaHeading.vue'),
      MagnoliaSpacer: loadAsyncComponent('./components/Magnolia/MagnoliaSpacer.vue'),
      MagnoliaContentList: loadAsyncComponent('./components/Magnolia/MagnoliaContentList.vue'),
      MagnoliaRichText: loadAsyncComponent('./components/Magnolia/MagnoliaRichText.vue'),
      MagnoliaCompositeButtonGroup: loadAsyncComponent('./components/Magnolia/MagnoliaCompositeButtonGroup.vue'),
      MagnoliaLocationsListing: loadAsyncComponent('./components/Magnolia/MagnoliaLocationsListing.vue'),
      MagnoliaMediaCollectionListing: loadAsyncComponent('./components/Magnolia/MagnoliaMediaCollectionListing.vue'),
      MagnoliaMediaAsset: loadAsyncComponent('./components/Magnolia/MagnoliaMediaAsset.vue'),
      MagnoliaAccordion: loadAsyncComponent('./components/Magnolia/MagnoliaAccordion.vue'),
      MagnoliaAccordionItem: loadAsyncComponent('./components/Magnolia/MagnoliaAccordionItem.vue'),
      MagnoliaVideo: loadAsyncComponent('./components/Magnolia/MagnoliaVideo.vue'),
      MagnoliaEmbedItem: loadAsyncComponent('./components/Magnolia/MagnoliaEmbedItem.vue'),
      MagnoliaBanner: loadAsyncComponent('./components/Magnolia/MagnoliaBanner.vue'),
      MagnoliaCopyThisText: loadAsyncComponent('./components/Magnolia/MagnoliaCopyThisText.vue'),
      MagnoliaSpecialEventTimes: loadAsyncComponent('./components/Magnolia/MagnoliaSpecialEventTimes.vue'),
      LocationSection: loadAsyncComponent('./components/LocationSection.vue'),
    };

    // Add them to the options module cache if needed, or just define them globally
    // For SFC loader to find them, they usually need to be in the components option of the parent
    // but MagnoliaZone resolves them via a map. We'll pass them in via a global mixin or similar.

    const Layout = {
      template: `
        <div class="layout">
          <TopBanner />
          <AppHeader />
          <router-view />
          <AppFooter />
          <FloatingSupport />
        </div>
      `,
      components: {
        TopBanner: loadAsyncComponent('./components/TopBanner.vue'),
        AppHeader: loadAsyncComponent('./components/AppHeader.vue'),
        AppFooter: loadAsyncComponent('./components/AppFooter.vue'),
        FloatingSupport: loadAsyncComponent('./components/FloatingSupport.vue')
      }
    };

    const DynamicPage = loadRouteComponent('./DynamicPage.vue');

    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(),
      routes: [
        {
          path: '/',
          component: Layout,
          children: [
            { path: '', component: loadRouteComponent('./App.vue') },
            { path: ':pathMatch(.*)*', component: DynamicPage }
          ]
        }
      ]
    });

    const app = Vue.createApp({ template: '<router-view />' });

    // Register Magnolia components globally
    for (const [name, component] of Object.entries(MagnoliaComponents)) {
      app.component(name, component);
    }

    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
